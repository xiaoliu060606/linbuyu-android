name: Build Linbuyu APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK (manual)
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -sL -o tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q tools.zip
          mv cmdline-tools latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1
          echo "Android SDK ready"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: "1.${{ github.run_number }}"
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: linbuyu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Push APK to server (bypass slow GitHub download, retry)
        run: |
          OK=0
          for i in 1 2 3; do
            echo "APK 推送尝试 $i"
            CODE=$(curl -s -m 240 -X POST "https://xuenai.cc.cd/api/apk" \
              -H "X-Apk-Token: linbuyu-build-2026" \
              --data-binary "@app/build/outputs/apk/debug/app-debug.apk" \
              -w "%{http_code}" -o /tmp/apkpush_resp.txt)
            echo "HTTP $CODE"
            if [ "$CODE" == "200" ]; then OK=1; break; fi
            sleep 20
          done
          if [ "$OK" != "1" ]; then echo "APK 推送最终失败"; cat /tmp/apkpush_resp.txt; exit 1; fi

      - name: Build incremental patch (bsdiff vs previous APK)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bsdiff > /dev/null 2>&1
          # 拉取服务器上的上一版 APK 作为基准
          PREV_CODE=$(( ${{ github.run_number }} - 1 ))
          PREV_URL="${SERVER_BASE}/apk/linbuyu-v1.0.apk"
          echo "基准版本 code=${PREV_CODE}"
          if curl -s -m 240 -o /tmp/prev.apk "${PREV_URL}" && [ -s /tmp/prev.apk ]; then
            echo "已下载上一版 APK: $(stat -c %s /tmp/prev.apk) bytes"
            OLD=/tmp/prev.apk; NEW=app/build/outputs/apk/debug/app-debug.apk; PATCH=/tmp/patch.bin
            bsdiff "$OLD" "$NEW" "$PATCH"
            echo "补丁生成: $(stat -c %s $PATCH) bytes (整包 $(stat -c %s $NEW) bytes)"
            # 推送补丁
            curl -s -m 120 -X POST "https://xuenai.cc.cd/api/patch/linbuyu-"${{ github.run_number }}.bin \
              -H "X-Apk-Token: linbuyu-build-2026" \
              --data-binary "@$PATCH" \
              -w "\npatch push: HTTP %{http_code}\n"
            echo "PATCH_READY=1" >> $GITHUB_ENV
            echo "PATCH_URL=/apk/patch/linbuyu-"${{ github.run_number }}.bin >> $GITHUB_ENV
            echo "PATCH_FROM=${PREV_CODE}" >> $GITHUB_ENV
          else
            echo "无上一版 APK（首次构建），跳过差分补丁"
            echo "PATCH_READY=0" >> $GITHUB_ENV
          fi
        env:
          SERVER_BASE: "https://xuenai.cc.cd"

      - name: Push version.json to server (OTA check)
        run: |
          if [ "${{ env.PATCH_READY }}" == "1" ]; then
            curl -s -m 30 -X POST "https://xuenai.cc.cd/api/version" \
              -H "X-Apk-Token: linbuyu-build-2026" \
              -H "Content-Type: application/json" \
              -d "{\"versionCode\": ${{ github.run_number }}, \"versionName\": \"1.${{ github.run_number }}\", \"patchUrl\": \"${{ env.PATCH_URL }}\", \"patchFrom\": ${{ env.PATCH_FROM }}}" \
              -w "\nversion push: HTTP %{http_code}\n"
          else
            curl -s -m 30 -X POST "https://xuenai.cc.cd/api/version" \
              -H "X-Apk-Token: linbuyu-build-2026" \
              -H "Content-Type: application/json" \
              -d "{\"versionCode\": ${{ github.run_number }}, \"versionName\": \"1.${{ github.run_number }}\"}" \
              -w "\nversion push (no patch): HTTP %{http_code}\n"
          fi
