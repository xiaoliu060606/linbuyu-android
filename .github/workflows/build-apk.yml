name: Build Linbuyu APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK (manual)
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -sL -o tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q tools.zip
          mv cmdline-tools latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1
          echo "Android SDK ready"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: "1.${{ github.run_number }}"
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: linbuyu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Push APK to server (bypass slow GitHub download, retry)
        run: |
          OK=0
          for i in 1 2 3; do
            echo "APK 推送尝试 $i"
            CODE=$(curl -s -m 240 -X POST "https://xuenai.cc.cd/api/apk?name=linbuyu-v1."${{ github.run_number }}.apk \
              -H "X-Apk-Token: linbuyu-build-2026" \
              --data-binary "@app/build/outputs/apk/debug/app-debug.apk" \
              -w "%{http_code}" -o /tmp/apkpush_resp.txt)
            echo "HTTP $CODE"
            if [ "$CODE" == "200" ]; then OK=1; break; fi
            sleep 20
          done
          if [ "$OK" != "1" ]; then echo "APK 推送最终失败"; cat /tmp/apkpush_resp.txt; exit 1; fi

      - name: Build incremental patch (bsdiff vs previous APK)
        run: |
          # 差分补丁改在服务器本地生成（避免 Actions↔服务器 大文件双向慢传输）
          # 服务器已持有旧 APK 和刚推送的新 APK，bsdiff 本地秒级完成
          curl -s -m 30 -X POST "https://xuenai.cc.cd/api/genpatch?code="${{ github.run_number }} \
            -H "X-Apk-Token: linbuyu-build-2026" \
            -w "\ngenpatch: HTTP %{http_code}\n"

      - name: Push version.json to server (OTA check)
        run: |
          curl -s -m 30 -X POST "https://xuenai.cc.cd/api/version" \
            -H "X-Apk-Token: linbuyu-build-2026" \
            -H "Content-Type: application/json" \
            -d "{\"versionCode\": ${{ github.run_number }}, \"versionName\": \"1.${{ github.run_number }}\"}" \
            -w "\nversion push: HTTP %{http_code}\n"
